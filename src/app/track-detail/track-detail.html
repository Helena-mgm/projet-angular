<section class="detail" aria-live="polite">
  @if (track(); as t) {
    <img [src]="t.coverUrl" [alt]="t.title" />
    <div>
      <h2>{{ t.title }} — {{ t.artist }}</h2>
      <p>{{ t.album }} ({{ t.year }})</p>
      <div class="actions">
        @if (isLoggedIn()) {
          <button type="button" (click)="deleteTrack()" aria-label="Supprimer ce morceau" class="delete">
            Supprimer
          </button>
          <button type="button" (click)="goToEdit()" aria-label="Modifier ce morceau" class="edit">
            Modifier
          </button>
        }
      </div>
      <dl>
        <div>
          <dt>Genre</dt>
          <dd>{{ t.genre }}</dd>
        </div>
        <div>
          <dt>Note</dt>
          <dd>{{ t.rating }}/10</dd>
        </div>
      </dl>
    </div>
  } @else if (isLoading()) {
    <p>Chargement…</p>
  } @else if (hasError()) {
    <p>Impossible de charger ce morceau.</p>
  }
</section>
